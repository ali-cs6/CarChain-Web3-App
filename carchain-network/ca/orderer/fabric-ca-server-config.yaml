version: 1.5.12

port: 8054

tls:
  enabled: true

ca:
  name: ca-orderer

csr:
  cn: ca-orderer
  keyrequest:
    algo: ecdsa
    size: 256
  names:
    - C: PK
      ST: KPK
      L: Abbottabad
      O: Orderer
      OU: CA
  hosts:
    - ca.orderer
    - localhost

signing:
  default:
    usage:
      - digital signature
    expiry: 8760h
  profiles:
    ca:
      usage:
        - cert sign
        - crl sign
      expiry: 43800h
      caconstraint:
        isca: true
        maxpathlen: 0
    tls:
      usage:
        - signing
        - key encipherment
        - server auth
        - client auth
        - key agreement
      expiry: 8760h

registry:
  maxenrollments: -1
  identities:
    - name: admin-orderer
      pass: adminpw
      type: admin
      affiliation: ""
      attrs:
        hf.Registrar.Roles: "*"
        hf.Registrar.DelegateRoles: "*"
        hf.Revoker: true
        hf.IntermediateCA: true
        hf.GenCRL: true
        hf.Registrar.Attributes: "*"
        hf.AffiliationMgr: true

db:
  type: sqlite3
  datasource: fabric-ca-server.db

affiliations:
  orderer:
    - department1

bccsp:
  default: SW
  sw:
    hash: SHA2
    security: 256
